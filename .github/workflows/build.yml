name: Build Plugin Package

on:
  push:
    branches:
      - "**"
    tags:
      - "v*"
  pull_request:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    outputs:
      version: ${{ steps.package.outputs.version }}

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Prepare package version
        id: package
        shell: bash
        run: |
          version=$(sed -n 's/^version: //p' plugins/Jev/config.yaml)
          if [[ "$GITHUB_REF" == refs/tags/* ]]; then
            if [[ "$GITHUB_REF_NAME" != "v$version" ]]; then
              printf 'Tag %s must match config.yaml version v%s\n' "$GITHUB_REF_NAME" "$version" >&2
              exit 1
            fi
          else
            sha_short=$(git rev-parse --short HEAD)
            version="${version}-${sha_short}"
            BUILD_VERSION="$version" perl -i -pe 's/^version:.*/version: $ENV{BUILD_VERSION}/' plugins/Jev/config.yaml
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Build plugin package
        run: |
          JEV_BUILD_UID="$(id -u)" JEV_BUILD_GID="$(id -g)" \
            docker compose run --rm --build builder

      - name: Upload package artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: Jev-${{ steps.package.outputs.version }}
          if-no-files-found: error
          path: |
            Jev-${{ steps.package.outputs.version }}.tar.gz
            Jev-${{ steps.package.outputs.version }}.zip

  release:
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write

    steps:
      - name: Download package artifact
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: Jev-${{ needs.build.outputs.version }}

      - name: Create draft GitHub Release
        uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3.0.3
        with:
          draft: true
          fail_on_unmatched_files: true
          files: |
            Jev-${{ needs.build.outputs.version }}.tar.gz
            Jev-${{ needs.build.outputs.version }}.zip
